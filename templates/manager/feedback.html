{% extends 'base.html' %}{% block title %}Give Feedback{% endblock %}{% block content %}<h2>Give Feedback</h2>{% if team %}<form method="post"><p><label>Team member<br><select name="emp_id" required>{% for e in team %}<option value="{{e.emp_id}}">{{e.name}}</option>{% endfor %}</select></label></p><p><label>Feedback<br><textarea name="feedback_text" required></textarea></label></p><button>Record Feedback</button></form>{% else %}<p>No team members available.</p>{% endif %}{% endblock %}
