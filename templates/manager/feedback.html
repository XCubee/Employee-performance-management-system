{% extends 'base.html' %}
{% block title %}Give Feedback{% endblock %}
{% block content %}
<h2>Give Feedback</h2>
{% if team %}
<form method="post">
  <label>Team member
    <select name="emp_id" id="feedback-employee" required>
      {% for employee in team %}
      <option value="{{ employee.emp_id }}" data-work-completion="{{ employee.work_completion }}">{{ employee.name }}</option>
      {% endfor %}
    </select>
  </label>
  <p>Work done: <strong id="feedback-work-completion">{{ team[0].work_completion }}%</strong></p>
  <label>Feedback
    <textarea name="feedback_text" required></textarea>
  </label>
  <button>Record Feedback</button>
</form>
<script>
  const feedbackEmployee = document.getElementById("feedback-employee");
  const workCompletion = document.getElementById("feedback-work-completion");
  if (feedbackEmployee && workCompletion) {
    feedbackEmployee.addEventListener("change", () => {
      const selectedOption = feedbackEmployee.selectedOptions[0];
      workCompletion.textContent = `${selectedOption.dataset.workCompletion}%`;
    });
  }
</script>
{% else %}
<p>No team members available.</p>
{% endif %}
{% endblock %}
