{% extends 'base.html' %}{% block title %}Edit Employee{% endblock %}{% block content %}<h2>Edit Employee</h2><form method="post"><p><label>Name<br><input name="name" value="{{employee.name}}" required></label></p><p><label>Department<br><input name="department" value="{{employee.department or ''}}"></label></p><p><label>Designation<br><input name="designation" value="{{employee.designation or ''}}"></label></p><p><label>Role<br><select name="role">{% for r in ['hr','manager','employee'] %}<option value="{{r}}" {% if employee.role==r %}selected{% endif %}>{{r}}</option>{% endfor %}</select></label></p><button>Save Changes</button></form>{% endblock %}
