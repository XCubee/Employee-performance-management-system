{% extends 'base.html' %}{% block title %}Add Employee{% endblock %}{% block content %}<h2>Add New Employee</h2><form method="post"><p><label>Full name<br><input name="name" required></label></p><p><label>Email<br><input type="email" name="email" required></label></p><p><label>Temporary password<br><input type="password" name="password" required></label></p><p><label>Role<br><select name="role"><option value="employee">employee</option><option value="manager">manager</option><option value="hr">hr</option></select></label></p><p><label>Department<br><input name="department"></label></p><p><label>Designation<br><input name="designation"></label></p><p><label>Manager / HR<br><select name="manager_id"><option value="">None</option>{% for m in managers %}<option value="{{m.emp_id}}">{{m.name}} — {{m.role}}</option>{% endfor %}</select></label></p><button>Create Employee</button></form>{% endblock %}
